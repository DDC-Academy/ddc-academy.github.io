<!-- 配置 MathJax 允许 AMS 样式自动编号 -->
<script>
  window.MathJax = {
    tex: {
      tags: 'ams', // 允许 AMS 样式标记/编号
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    }
  };
</script>
<!-- 加载 MathJax v3 -->
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
